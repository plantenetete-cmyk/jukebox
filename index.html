<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Jukebox</title>
<style>
:root {
  --accent: #fa2d48;
  --bg: #ffffff; --bg2: #f2f2f7; --card: #ffffff;
  --text: #000000; --text2: #8a8a8e; --line: #d1d1d6;
  --bar: rgba(249,249,249,.94); --shadow: 0 10px 30px rgba(0,0,0,.18);
  --row: 64px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000000; --bg2: #1c1c1e; --card: #1c1c1e; --text: #ffffff; --text2: #8d8d93;
          --line: #38383a; --bar: rgba(22,22,24,.94); --shadow: 0 10px 30px rgba(0,0,0,.6); }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- pages ---------- */
#app { position: fixed; inset: 0; }
.page { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 160px); background: var(--bg); }
.navbar { display: flex; align-items: center; height: 48px; padding: 0 8px; }
.back { color: var(--accent); display: flex; align-items: center; gap: 2px; font-size: 18px; min-height: 48px; padding: 0 8px; }
.back svg { width: 14px; height: 24px; }
h1.big { font-size: 34px; font-weight: 700; margin: 4px 20px 12px; letter-spacing: .3px; }
h2 { font-size: 22px; font-weight: 700; margin: 24px 20px 10px; }
.sub { color: var(--text2); font-size: 15px; margin: 0 20px; }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0 0 0 20px; }
.row { display: flex; align-items: center; gap: 14px; min-height: var(--row); padding-right: 20px;
  border-bottom: .5px solid var(--line); content-visibility: auto; contain-intrinsic-size: auto var(--row); }
.row:active { background: var(--bg2); }
.row .txt { flex: 1; min-width: 0; }
.row .t1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 18px; }
.row .t2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text2); font-size: 15px; }
.row .num { width: 26px; text-align: center; color: var(--text2); font-size: 16px; flex: none; }
.row .dur { color: var(--text2); font-size: 15px; flex: none; }
.row .chev { color: var(--text2); flex: none; width: 10px; }
.row.menu .t1 { color: var(--accent); font-size: 21px; }
.row.menu .ico { width: 30px; color: var(--accent); flex: none; display: flex; justify-content: center; }
.row.playing .t1 { color: var(--accent); font-weight: 600; }
.list.az .row { padding-right: 30px; }
.letter { position: sticky; top: 0; z-index: 2; background: var(--bg2); color: var(--text2); font-weight: 600;
  font-size: 15px; padding: 4px 20px; margin-left: -20px; }

/* A-Z index on the right edge (like the iPhone) */
.azbar { position: fixed; right: 2px; top: calc(env(safe-area-inset-top) + 120px); bottom: calc(env(safe-area-inset-bottom) + 170px);
  width: 26px; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  color: var(--accent); font-size: 11px; font-weight: 600; z-index: 5; touch-action: none; }

/* ---------- covers (made from the album name: no images on the card) ---------- */
.cover { position: relative; flex: none; border-radius: 6px; overflow: hidden; display: flex; align-items: center;
  justify-content: center; color: rgba(255,255,255,.92); font-weight: 700; letter-spacing: .5px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.cover.s { width: 48px; height: 48px; font-size: 17px; border-radius: 5px; }
.cover.round { border-radius: 50%; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 16px; padding: 0 20px; }
.tile { min-width: 0; }
.tile .cover { width: 100%; aspect-ratio: 1; font-size: 40px; border-radius: 8px; }
.tile .t1 { margin-top: 6px; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .t2 { color: var(--text2); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* album / artist header */
.head { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px; }
.head .cover { width: min(64vw, 280px); height: min(64vw, 280px); font-size: 70px; border-radius: 10px; box-shadow: var(--shadow); }
.head .cover.round { width: 170px; height: 170px; font-size: 54px; }
.head .ttl { font-size: 24px; font-weight: 700; margin-top: 18px; }
.head .art { font-size: 21px; color: var(--accent); margin-top: 2px; }
.btns { display: flex; gap: 14px; padding: 20px; }
.pill { flex: 1; height: 54px; border-radius: 12px; background: var(--bg2); color: var(--accent); font-weight: 600; font-size: 18px;
  display: flex; align-items: center; justify-content: center; gap: 8px; }
.pill:active { opacity: .6; }
.pill svg { width: 20px; height: 20px; }
.foot { color: var(--text2); font-size: 15px; padding: 14px 20px; }

/* ---------- search ---------- */
.searchbox { margin: 0 20px 10px; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px;
  background: var(--bg2); border-radius: 12px; color: var(--text2); }
.searchbox input { flex: 1; border: 0; background: none; color: var(--text); font: inherit; font-size: 18px; outline: none; min-width: 0; }
.searchbox button { color: var(--text2); font-size: 20px; width: 32px; height: 32px; }
.empty { color: var(--text2); text-align: center; padding: 40px 30px; font-size: 17px; }

/* ---------- settings ---------- */
.group { margin: 0 16px 24px; background: var(--card); border-radius: 12px; overflow: hidden; }
@media (prefers-color-scheme: light) { #pageSettings { background: var(--bg2); } }
.group .row { padding: 0 16px; border-bottom: .5px solid var(--line); }
.group .row:last-child { border-bottom: 0; }
.ghead { color: var(--text2); font-size: 14px; text-transform: uppercase; margin: 10px 32px 6px; }
.gfoot { color: var(--text2); font-size: 14px; margin: -16px 32px 24px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: #8e8e93; flex: none; }
.dot.ok { background: #34c759; } .dot.warn { background: #ff9f0a; } .dot.bad { background: #ff3b30; } .dot.scan { background: #0a84ff; }
.act { color: var(--accent); font-size: 18px; }
.field { display: flex; gap: 10px; padding: 10px 16px; }
.field input { flex: 1; height: 46px; border-radius: 10px; border: 0; background: var(--bg2); color: var(--text); font: inherit; padding: 0 12px; min-width: 0; }
.field button { color: var(--accent); font-weight: 600; padding: 0 10px; }
.bars { font-size: 13px; color: var(--text2); letter-spacing: -1px; }

/* ---------- mini player + tab bar ---------- */
#bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; }
#mini { margin: 0 8px 6px; height: 68px; border-radius: 14px; background: var(--bar); box-shadow: 0 4px 20px rgba(0,0,0,.18);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); display: flex; align-items: center; gap: 12px; padding: 0 8px 0 10px; }
#mini .txt { flex: 1; min-width: 0; }
#mini .t1 { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini .t2 { font-size: 14px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; flex: none; border-radius: 50%; }
.ib:active { background: var(--bg2); }
.ib svg { width: 30px; height: 30px; }
#tabs { display: flex; background: var(--bar); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-top: .5px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
#tabs button { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 12px; color: var(--text2); }
#tabs button svg { width: 28px; height: 28px; }
#tabs button.on { color: var(--accent); }

/* ---------- now playing (full screen) ---------- */
#np { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top) + 8px) 28px calc(env(safe-area-inset-bottom) + 18px);
  color: #fff; background: #333; transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
#np.open { transform: none; }
#np .grab { width: 100%; height: 34px; flex: none; display: flex; justify-content: center; align-items: center; }
#np .grab span { width: 44px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.45); }
#npCover { width: min(76vw, 36vh, 360px); height: min(76vw, 36vh, 360px); font-size: 80px; border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0,0,0,.45); margin-top: 1vh; flex: none; transition: transform .3s; }
#np.paused #npCover { transform: scale(.82); }
.npinfo { align-self: stretch; margin-top: 3vh; }
#npTitle { font-size: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#npArtist { font-size: 21px; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slider { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: none; margin: 0; }
.slider::-webkit-slider-runnable-track { height: 7px; border-radius: 4px;
  background: linear-gradient(to right, rgba(255,255,255,.9) var(--p, 0%), rgba(255,255,255,.28) var(--p, 0%)); }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff;
  margin-top: -10.5px; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.slider::-moz-range-track { height: 7px; border-radius: 4px; background: rgba(255,255,255,.28); }
.slider::-moz-range-progress { height: 7px; border-radius: 4px; background: rgba(255,255,255,.9); }
.slider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 0; }
.times { display: flex; justify-content: space-between; font-size: 13px; opacity: .65; margin-top: -6px; font-variant-numeric: tabular-nums; }
.npctl { display: flex; justify-content: space-evenly; align-items: center; align-self: stretch; margin: 1vh 0; }
.npctl button { width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.npctl button:active { background: rgba(255,255,255,.15); }
.npctl svg { width: 50px; height: 50px; }
.npctl .main svg { width: 70px; height: 70px; }
.vol { display: flex; align-items: center; gap: 10px; align-self: stretch; }
.vol svg { width: 22px; height: 22px; opacity: .65; flex: none; }
.npbot { display: flex; justify-content: space-around; align-self: stretch; margin-top: auto; padding-top: 6px; }
.npbot button { width: 64px; height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 12px; opacity: .65; font-size: 11px; gap: 2px; }
.npbot button.on { opacity: 1; background: rgba(255,255,255,.2); }
.npbot svg { width: 28px; height: 28px; }
#npSpk { font-size: 14px; opacity: .75; text-align: center; margin-top: 6px; min-height: 18px; }

/* ---------- connect screen, sheets, toast ---------- */
#connect { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 30px; text-align: center; gap: 16px; }
#connect .logo { width: 120px; height: 120px; border-radius: 28px; background: linear-gradient(135deg, #fa2d48, #a833e0);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
#connect .logo svg { width: 64px; height: 64px; color: #fff; }
.bigbtn { min-width: 260px; height: 60px; border-radius: 16px; background: var(--accent); color: #fff; font-size: 20px; font-weight: 600; }
.bigbtn:active { opacity: .7; }
.link { color: var(--accent); font-size: 17px; padding: 12px; }
#sheet { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; }
#sheet .box { width: 100%; margin: 8px; margin-bottom: calc(env(safe-area-inset-bottom) + 8px); }
#sheet .card { background: var(--card); border-radius: 14px; overflow: hidden; text-align: center; margin-bottom: 8px; }
#sheet .msg { padding: 18px 20px; color: var(--text2); font-size: 15px; }
#sheet .msg b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
#sheet button { display: block; width: 100%; height: 60px; font-size: 20px; color: var(--accent); border-top: .5px solid var(--line); }
#sheet .cancel { border: 0; font-weight: 600; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 10px); transform: translateX(-50%); z-index: 90;
  background: var(--bar); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  border-radius: 22px; padding: 12px 20px; font-size: 15px; max-width: 90vw; text-align: center; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 20px; }
.prog div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
</style>
</head>
<body>
<div id="app">
  <div id="pageLibrary" class="page"></div>
  <div id="pageSearch" class="page hidden"></div>
  <div id="pageSettings" class="page hidden"></div>
</div>
<div id="azbar" class="azbar hidden"></div>

<div id="bottom">
  <div id="mini" class="hidden">
    <div id="miniCover" class="cover s"></div>
    <div class="txt"><div class="t1" id="miniTitle"></div><div class="t2" id="miniArtist"></div></div>
    <button class="ib" id="miniPlay" aria-label="Lecture/Pause"></button>
    <button class="ib" id="miniNext" aria-label="Suivante"></button>
  </div>
  <nav id="tabs">
    <button data-tab="Library" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h2v16H4zM9 4h2v16H9zM14.2 4.6l1.9-.7 5.5 15.1-1.9.7z"/></svg>Bibliothèque</button>
    <button data-tab="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Recherche</button>
    <button data-tab="Settings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 5a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2.2a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/></svg>Enceinte</button>
  </nav>
</div>

<div id="np">
  <div class="grab" id="npClose"><span></span></div>
  <div id="npCover" class="cover"></div>
  <div class="npinfo">
    <div id="npTitle"></div>
    <div id="npArtist"></div>
    <input type="range" class="slider" id="seek" min="0" max="1000" value="0">
    <div class="times"><span id="tNow">0:00</span><span id="tLeft">-0:00</span></div>
  </div>
  <div class="npctl">
    <button id="npPrev" aria-label="Précédente"></button>
    <button id="npPlay" class="main" aria-label="Lecture/Pause"></button>
    <button id="npNext" aria-label="Suivante"></button>
  </div>
  <div class="vol">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
    <input type="range" class="slider" id="vol" min="0" max="100" value="50">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3zM15 8.5a5 5 0 0 1 0 7l-1.2-1.2a3.3 3.3 0 0 0 0-4.6zM17.8 5.7a9 9 0 0 1 0 12.6l-1.2-1.2a7.3 7.3 0 0 0 0-10.2z"/></svg>
  </div>
  <div id="npSpk"></div>
  <div class="npbot">
    <button id="npShuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c4 0 6 10 10 10H21M3 17h3.5c1.6 0 2.8-1.6 3.9-3.6M13.6 9.6C14.7 8 15.9 7 17 7h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Aléatoire</button>
    <button id="npSpeaker"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm4 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0-5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>Enceinte</button>
  </div>
</div>

<div id="connect">
  <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17.5V6l11-2.5v11.6a3 3 0 1 1-2-2.8V7.2l-7 1.6v8.7a3 3 0 1 1-2-2.8z"/></svg></div>
  <h1 style="margin:10px 0 0">Jukebox</h1>
  <div class="sub" id="connectHint">Allume le jukebox, puis touche le bouton.</div>
  <button class="bigbtn" id="connectBtn">Se connecter</button>
  <button class="link" id="offlineBtn">Parcourir sans se connecter</button>
</div>

<div id="sheet" class="hidden"><div class="box"><div class="card" id="sheetCard"></div><div class="card"><button class="cancel" id="sheetCancel">Annuler</button></div></div></div>
<div id="toast" class="hidden"></div>

<script>
"use strict";
// ====================================================================
//  BLE link with the jukebox (same service as before, + catalog channel)
// ====================================================================
const SERVICE = "6e6a0001-8f2b-4b8e-9a6f-4a756b65626f";
const CMD     = "6e6a0002-8f2b-4b8e-9a6f-4a756b65626f";
const STATUS  = "6e6a0003-8f2b-4b8e-9a6f-4a756b65626f";
const RESULT  = "6e6a0004-8f2b-4b8e-9a6f-4a756b65626f";
const CATALOG = "6e6a0005-8f2b-4b8e-9a6f-4a756b65626f";

const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
let device, cmdChar, connected = false, status = { state: "stop", index: -1, secs: 0, speaker: -1 };

const ICON = {
  play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></svg>',
  next:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 6.2v11.6a.8.8 0 0 0 1.2.7L12 13v4.8a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8A.8.8 0 0 0 12 6.2V11L3.7 5.5a.8.8 0 0 0-1.2.7z"/></svg>',
  prev:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 6.2v11.6a.8.8 0 0 1-1.2.7L12 13v4.8a.8.8 0 0 1-1.2.7l-9-5.8a.8.8 0 0 1 0-1.4l9-5.8a.8.8 0 0 1 1.2.7V11l8.3-5.5a.8.8 0 0 1 1.2.7z"/></svg>',
  shuf:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c4 0 6 10 10 10H21M3 17h3.5c1.6 0 2.8-1.6 3.9-3.6M13.6 9.6C14.7 8 15.9 7 17 7h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
  chev:  '<svg viewBox="0 0 8 14" width="8" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l6 6-6 6"/></svg>',
  back:  '<svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg>',
  mic:   '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><circle cx="9" cy="8" r="4"/><path d="M2 20c0-3.5 3.1-6 7-6s7 2.5 7 6z"/></svg>',
  album: '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="12" r="3.5"/></svg>',
  note:  '<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M9 17.5V6l11-2.5v11.6a3 3 0 1 1-2-2.8V7.2l-7 1.6v8.7a3 3 0 1 1-2-2.8z"/></svg>',
};
$("miniPlay").innerHTML = ICON.play; $("miniNext").innerHTML = ICON.next;
$("npPrev").innerHTML = ICON.prev; $("npPlay").innerHTML = ICON.play; $("npNext").innerHTML = ICON.next;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

let toastTimer;
function toast(t, ms) {
  const el = $("toast");
  if (!t) { el.classList.add("hidden"); return; }
  el.textContent = t; el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), ms || 3500);
}

if (!navigator.bluetooth) {
  $("connectHint").textContent = "Ce navigateur n'a pas accès au Bluetooth. Sur iPhone, ouvre cette page dans l'app gratuite Bluefy.";
}

$("connectBtn").onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
    device.addEventListener("gattserverdisconnected", onDisconnected);
    $("connectHint").textContent = "Connexion…";
    await openGatt();
  } catch (e) { $("connectHint").textContent = e.message; }
};
$("offlineBtn").onclick = () => $("connect").classList.add("hidden");

// reconnect by itself to a jukebox already allowed before
(async () => {
  try {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
    const known = (await navigator.bluetooth.getDevices()).filter(d => (d.name || "").startsWith("Jukebox"));
    if (!known.length) return;
    device = known[0];
    device.addEventListener("gattserverdisconnected", onDisconnected);
    $("connectHint").textContent = "Reconnexion au jukebox…";
    await openGatt();
  } catch (e) { $("connectHint").textContent = "Allume le jukebox, puis touche le bouton."; }
})();

async function openGatt() {
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  cmdChar = await svc.getCharacteristic(CMD);
  const st = await svc.getCharacteristic(STATUS);
  const rs = await svc.getCharacteristic(RESULT);
  let ct = null;
  try { ct = await svc.getCharacteristic(CATALOG); } catch (e) {}
  st.addEventListener("characteristicvaluechanged", e => onStatus(dec.decode(e.target.value)));
  rs.addEventListener("characteristicvaluechanged", e => onResult(dec.decode(e.target.value)));
  await st.startNotifications();
  await rs.startNotifications();
  if (ct) {
    ct.addEventListener("characteristicvaluechanged", e => onCatalogPiece(e.target.value));
    await ct.startNotifications();
  }
  onStatus(dec.decode(await st.readValue()));
  connected = true;
  $("connect").classList.add("hidden");
  send("info");          // which song list is on the card?
  send("speakers");
  renderSettings();
}

async function onDisconnected() {
  connected = false; cmdChar = null;
  status.speaker = -1;
  renderSettings(); drawPlayer();
  toast("Connexion perdue, reconnexion…", 6000);
  for (let i = 0; i < 6; i++) {
    try { await openGatt(); toast(""); return; } catch (e) { await new Promise(r => setTimeout(r, 2500)); }
  }
  toast("");
  $("connectHint").textContent = "Connexion perdue. Touche le bouton pour te reconnecter.";
  $("connect").classList.remove("hidden");
}

// commands are queued so two quick taps never collide
let queue = Promise.resolve();
function send(text) {
  if (!cmdChar) { if (!connected) $("connect").classList.remove("hidden"); return; }
  queue = queue.then(() => cmdChar.writeValue(enc.encode(text))).catch(e => toast(e.message));
}

// ====================================================================
//  Song list (catalog): downloaded once from the card, kept on the phone
// ====================================================================
// catalog.txt: "#JUKEBOX-CATALOG 1<TAB>id<TAB>songs", then "@<TAB>artist<TAB>album" before
// each album and "title<TAB>seconds" for each song, in the jukebox's song order.
let songs = [], albums = [], artists = [], catId = load("catId") || "";
const UNKNOWN_ARTIST = "Artiste inconnu", UNKNOWN_ALBUM = "Album inconnu";

function fold(s) {   // "Céline" -> "celine", "AC/DC" -> "acdc", "Metallica" -> "metalica"
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/[^a-z0-9]/g, "").replace(/([a-z])\1+/g, "$1");
}
function sortKey(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/^(the|les|le|la|l')\s+/, "");
}
function letterOf(s) { const c = sortKey(s).charAt(0).toUpperCase(); return c >= "A" && c <= "Z" ? c : "#"; }

function parseCatalog(text) {
  const lines = text.split("\n");
  songs = []; albums = []; artists = [];
  let al = null;
  for (let i = 1; i < lines.length; i++) {
    const f = lines[i].split("\t");
    if (f.length === 3 && f[0] === "@") {
      al = { artist: f[1] || UNKNOWN_ARTIST, name: f[2] || UNKNOWN_ALBUM, first: songs.length, count: 0, secs: 0 };
      albums.push(al);
    } else if (f.length === 2 && al) {
      const s = { i: songs.length, title: f[0], secs: +f[1] || 0, al };
      s.key = fold(s.title + " " + al.artist + " " + al.name);
      songs.push(s); al.count++; al.secs += s.secs;
    }
  }
  albums = albums.filter(a => a.count);
  const byName = new Map();
  for (const a of albums) {
    let ar = byName.get(a.artist.toLowerCase());
    if (!ar) { ar = { name: a.artist, albums: [], first: a.first, count: 0 }; byName.set(a.artist.toLowerCase(), ar); artists.push(ar); }
    ar.albums.push(a); ar.count += a.count;
    a.ar = ar;
  }
  const cmp = (x, y) => sortKey(x).localeCompare(sortKey(y), "fr");
  artists.sort((x, y) => cmp(x.name, y.name));
  for (const a of albums) a.key = fold(a.name + " " + a.artist);
  for (const a of artists) a.key = fold(a.name);
}

// downloading: pieces "C"+position(4 bytes)+data, then "E"+size(4 bytes)
let dl = null;
function startDownload(id, size) {
  dl = { id, size, buf: new Uint8Array(size), got: 0, last: Date.now(), asked: Date.now() };
  send("cat:0");
  renderLibrary();
}
function onCatalogPiece(dv) {
  if (!dl) return;
  const type = String.fromCharCode(dv.getUint8(0)), pos = dv.getUint32(1, true);
  dl.last = Date.now();
  if (type === "C") {
    const n = dv.byteLength - 5;
    if (pos === dl.got) {
      dl.buf.set(new Uint8Array(dv.buffer, dv.byteOffset + 5, n), pos);
      dl.got += n;
    } else if (pos > dl.got) askAgain();
    drawProgress();
  } else if (type === "E") {
    if (dl.got >= dl.size) {
      const text = dec.decode(dl.buf);
      parseCatalog(text);
      store("catalog", text); store("catId", dl.id);
      catId = dl.id; dl = null;
      toast(`Bibliothèque prête : ${songs.length} chansons`);
      renderAll();
    } else askAgain();
  }
}
function askAgain() {
  if (Date.now() - dl.asked < 1000) return;
  dl.asked = Date.now();
  send("cat:" + dl.got);
}
setInterval(() => { if (dl && connected && Date.now() - dl.last > 2500) { dl.last = Date.now(); dl.asked = 0; askAgain(); } }, 1000);
function drawProgress() {
  const p = $("dlProg");
  if (p && dl) { p.style.width = (dl.got * 100 / dl.size) + "%"; $("dlText").textContent = `Chargement de la bibliothèque… ${Math.floor(dl.got * 100 / dl.size)} %`; }
}

let cardInfo = null;
function onResult(line) {
  const f = line.split("\t");
  if (f[0] === "cat") {
    cardInfo = { id: f[1], size: +f[2], songs: +f[3] };
    if (f[1] === "none") { songs.length || renderAll(); return; }
    if (f[1] !== catId || !songs.length) startDownload(f[1], +f[2]);
    return;
  }
  if (f[0] === "spk") { addSpeaker(f[1], +f[2]); return; }
  if (f[0] === "tgt") { wantedSpeaker = f[1]; renderSettings(); }
}

// ====================================================================
//  Status from the jukebox
// ====================================================================
// state|index|count|volume|shuffle|speaker|seconds|title|artist|album|position|rangeFirst|rangeCount
let elapsed = 0, lastKey = "", seekDragging = false, volDragging = false;
function onStatus(s) {
  const p = s.split("|");
  if (p.length < 10) return;
  const prevIndex = status.index;
  status = { state: p[0].trim(), index: +p[1], count: +p[2], vol: +p[3], shuffle: p[4] === "1",
             speaker: +p[5], secs: +p[6], title: p[7], artist: p[8], album: (p[9] || "").trim(),
             pm: p.length > 10 ? +p[10] : 0 };
  const key = status.index + "|" + status.title;
  if (!seekDragging && status.secs) elapsed = status.secs * status.pm / 1000;
  if (key !== lastKey) { lastKey = key; if (!status.pm) elapsed = 0; }
  drawPlayer();
  if (prevIndex !== status.index) markPlaying();
}

setInterval(() => {
  if (connected && status.state === "play" && status.speaker === 1 && !seekDragging) {
    elapsed = Math.min(status.secs || 0, elapsed + 0.5);
    drawTime();
  }
}, 500);

const mss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function hue(text) { let h = 0; for (const c of text || "") h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function coverStyle(el, name, sub) {
  const h = hue((name || "") + "|" + (sub || "")), a = h % 360, b = (a + 40 + (h >> 9) % 80) % 360;
  el.style.background = `linear-gradient(135deg, hsl(${a} 65% 52%), hsl(${b} 60% 32%))`;
  const words = (name || "?").replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean);
  el.textContent = ((words[0] || "?")[0] + (words[1] ? words[1][0] : "")).toUpperCase();
  return el;
}
function makeCover(name, sub, cls) { const d = document.createElement("div"); d.className = "cover " + (cls || ""); return coverStyle(d, name, sub); }

function drawPlayer() {
  const has = status.index >= 0 && status.title;
  $("mini").classList.toggle("hidden", !has);
  const playing = status.state === "play";
  $("miniPlay").innerHTML = playing ? ICON.pause : ICON.play;
  $("npPlay").innerHTML = playing ? ICON.pause : ICON.play;
  $("np").classList.toggle("paused", !playing);
  $("miniTitle").textContent = status.title || "Pas de lecture";
  $("miniArtist").textContent = status.artist || "";
  $("npTitle").textContent = status.title || "";
  $("npArtist").textContent = (status.artist || "") + (status.album ? " — " + status.album : "");
  const cKey = status.album + "|" + status.artist;
  if ($("np").dataset.c !== cKey) {
    $("np").dataset.c = cKey;
    coverStyle($("miniCover"), status.album || status.title, status.artist);
    coverStyle($("npCover"), status.album || status.title, status.artist);
    const h = hue((status.album || status.title || "") + "|" + (status.artist || "")) % 360;
    $("np").style.background = `linear-gradient(180deg, hsl(${h} 45% 34%), hsl(${h} 35% 14%))`;
  }
  if (!volDragging) setSlider($("vol"), status.vol || 0, 100);
  $("npShuffle").classList.toggle("on", status.shuffle);
  const sp = { 1: "Enceinte connectée", 2: "Connexion à l'enceinte…", 3: "Recherche d'enceintes…", 0: "Enceinte non connectée" };
  $("npSpk").textContent = connected ? (sp[status.speaker] || "") : "Jukebox non connecté";
  drawTime();
}
function setSlider(el, v, max) { el.value = v; el.style.setProperty("--p", (v * 100 / max) + "%"); }
function drawTime() {
  const secs = status.secs || 0;
  if (!seekDragging) setSlider($("seek"), secs ? Math.round(elapsed * 1000 / secs) : 0, 1000);
  const t = seekDragging ? secs * $("seek").value / 1000 : elapsed;
  $("tNow").textContent = mss(t);
  $("tLeft").textContent = "-" + mss(secs - t);
}

// ---------------- now playing controls ----------------
$("mini").onclick = e => { if (!e.target.closest(".ib")) openNP(true); };
$("miniPlay").onclick = () => send(status.state === "play" ? "pause" : "play");
$("miniNext").onclick = () => send("next");
$("npPlay").onclick = () => send(status.state === "play" ? "pause" : "play");
$("npNext").onclick = () => send("next");
$("npPrev").onclick = () => send("prev");
$("npShuffle").onclick = () => { send("shuffle:" + (status.shuffle ? 0 : 1)); status.shuffle = !status.shuffle; drawPlayer(); };
$("npSpeaker").onclick = () => { openNP(false); showTab("Settings"); };
$("npClose").onclick = () => openNP(false);
function openNP(on) { $("np").classList.toggle("open", on); }
// swipe down to close
let npY = null;
$("np").addEventListener("touchstart", e => { if (!e.target.closest("input")) npY = e.touches[0].clientY; }, { passive: true });
$("np").addEventListener("touchend", e => { if (npY !== null && e.changedTouches[0].clientY - npY > 90) openNP(false); npY = null; });

$("seek").oninput = e => { seekDragging = true; setSlider(e.target, +e.target.value, 1000); drawTime(); };
function seekDone() {
  if (!seekDragging) return;
  seekDragging = false;
  const pm = Math.min(999, +$("seek").value);
  send("seek:" + pm);
  elapsed = (status.secs || 0) * pm / 1000;
  drawTime();
}
$("seek").onchange = seekDone;
$("seek").addEventListener("touchend", () => setTimeout(seekDone, 50));

let volTimer;
$("vol").oninput = e => {
  volDragging = true;
  setSlider(e.target, +e.target.value, 100);
  clearTimeout(volTimer);
  volTimer = setTimeout(() => { send("vol:" + e.target.value); status.vol = +e.target.value; volDragging = false; }, 150);
};

// ====================================================================
//  Playing from the lists
// ====================================================================
// "next" stays inside the album / artist you started from, like on the iPhone
function playSong(i, first, count) {
  if (first === undefined) send("idx:" + i);
  else send(`play:${i}:${first}:${count}`);
  elapsed = 0;
  if (window.innerHeight > 500) setTimeout(() => openNP(true), 150);
}
function playGroup(first, count, shuf) {
  send("shuffle:" + (shuf ? 1 : 0));
  playSong(shuf ? first + Math.floor(Math.random() * count) : first, first, count);
}
function markPlaying() {
  document.querySelectorAll(".row.playing").forEach(r => r.classList.remove("playing"));
  document.querySelectorAll(`.row[data-i="${status.index}"]`).forEach(r => r.classList.add("playing"));
}

// ====================================================================
//  Pages (Bibliothèque > Artistes / Albums / Chansons, Recherche, Enceinte)
// ====================================================================
const stack = [];   // library navigation: [{render, scroll}]
let tab = "Library";

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  if (b.dataset.tab === tab && tab === "Library") { stack.length = 0; renderLibrary(); }
  showTab(b.dataset.tab);
});
function showTab(t) {
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  for (const n of ["Library", "Search", "Settings"]) $("page" + n).classList.toggle("hidden", n !== t);
  $("azbar").classList.toggle("hidden", t !== "Library" || !$("pageLibrary").querySelector(".letter"));
  if (t === "Settings") renderSettings();
  if (t === "Search") setTimeout(() => { const i = $("q"); if (i && !i.value) i.focus(); }, 50);
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function txt(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = text; return e; }

function row({ cover, t1, t2, num, dur, chev, i, onClick, menu, icon }) {
  const r = el("li", "row" + (menu ? " menu" : ""));
  if (icon) r.appendChild(el("span", "ico", icon));
  if (cover) r.appendChild(cover);
  if (num !== undefined) r.appendChild(txt("span", "num", num));
  const tx = el("div", "txt");
  tx.appendChild(txt("div", "t1", t1));
  if (t2) tx.appendChild(txt("div", "t2", t2));
  r.appendChild(tx);
  if (dur !== undefined) r.appendChild(txt("span", "dur", dur));
  if (chev) r.appendChild(el("span", "chev", ICON.chev));
  if (i !== undefined) { r.dataset.i = i; if (i === status.index) r.classList.add("playing"); }
  r.onclick = onClick;
  return r;
}

function navbar(page, title) {
  if (!stack.length) return;
  const nb = el("div", "navbar");
  const b = el("button", "back", ICON.back);
  b.appendChild(document.createTextNode(stack.length > 1 ? stack[stack.length - 2].title : "Bibliothèque"));
  b.onclick = goBack;
  nb.appendChild(b);
  page.appendChild(nb);
}
function push(title, render) {
  const page = $("pageLibrary");
  if (stack.length) stack[stack.length - 1].scroll = page.scrollTop;
  else rootScroll = page.scrollTop;
  stack.push({ title, render });
  drawLibraryTop();
  page.scrollTop = 0;
}
let rootScroll = 0;
function goBack() {
  stack.pop();
  drawLibraryTop();
  $("pageLibrary").scrollTop = stack.length ? stack[stack.length - 1].scroll || 0 : rootScroll;
}
// swipe from the left edge = back (like the iPhone)
let swX = null;
$("pageLibrary").addEventListener("touchstart", e => { const x = e.touches[0].clientX; swX = x < 30 && stack.length ? x : null; }, { passive: true });
$("pageLibrary").addEventListener("touchend", e => { if (swX !== null && e.changedTouches[0].clientX - swX > 80) goBack(); swX = null; });

function drawLibraryTop() {
  const page = $("pageLibrary");
  page.innerHTML = "";
  if (stack.length) { navbar(page); stack[stack.length - 1].render(page); }
  else renderLibraryRoot(page);
  $("azbar").classList.toggle("hidden", tab !== "Library" || !page.querySelector(".letter"));
  buildAz(page);
}
function renderLibrary() { drawLibraryTop(); }

function noCatalogBox(page) {
  if (dl) {
    const b = el("div");
    b.appendChild(txt("div", "sub", "")).id = "dlText";
    const pr = el("div", "prog"); const bar = el("div"); bar.id = "dlProg"; pr.appendChild(bar); b.appendChild(pr);
    b.appendChild(txt("div", "sub", "Une seule fois : la liste reste ensuite sur ton téléphone. La musique continue pendant ce temps."));
    page.appendChild(b); drawProgress();
    return true;
  }
  if (!songs.length) {
    page.appendChild(txt("div", "empty", cardInfo && cardInfo.id === "none"
      ? "La carte SD n'a pas encore de catalogue. Sur le PC, lance  python make_library.py E:\\  puis remets la carte."
      : connected ? "Chargement…" : "Connecte-toi au jukebox pour charger la bibliothèque."));
    return true;
  }
  return false;
}

function renderLibraryRoot(page) {
  page.appendChild(txt("h1", "big", "Bibliothèque"));
  if (noCatalogBox(page)) return;
  const ul = el("ul", "list");
  ul.appendChild(row({ menu: true, icon: ICON.mic, t1: "Artistes", chev: true, onClick: () => push("Artistes", renderArtists) }));
  ul.appendChild(row({ menu: true, icon: ICON.album, t1: "Albums", chev: true, onClick: () => push("Albums", renderAlbums) }));
  ul.appendChild(row({ menu: true, icon: ICON.note, t1: "Chansons", chev: true, onClick: () => push("Chansons", renderSongs) }));
  page.appendChild(ul);
  const btns = el("div", "btns");
  const sh = el("button", "pill", ICON.shuf + "Tout en aléatoire");
  sh.onclick = () => playGroup(0, songs.length, true);
  btns.appendChild(sh);
  page.appendChild(btns);
  page.appendChild(txt("div", "foot", `${artists.length} artistes · ${albums.length} albums · ${songs.length} chansons`));
}

function lettered(page, items, nameOf, makeRow) {
  const ul = el("ul", "list az");
  let last = null;
  for (const it of items) {
    const L = letterOf(nameOf(it));
    if (L !== last) { last = L; const h = txt("li", "letter", L); h.dataset.l = L; ul.appendChild(h); }
    ul.appendChild(makeRow(it));
  }
  page.appendChild(ul);
}

function renderArtists(page) {
  page.appendChild(txt("h1", "big", "Artistes"));
  lettered(page, artists, a => a.name, a => row({
    cover: makeCover(a.name, "", "s round"), t1: a.name,
    t2: `${a.albums.length} album${a.albums.length > 1 ? "s" : ""} · ${a.count} chanson${a.count > 1 ? "s" : ""}`,
    chev: true, onClick: () => openArtist(a) }));
}

function albumGrid(page, list, showArtist) {
  const g = el("div", "grid");
  for (const a of list) {
    const t = el("div", "tile");
    t.appendChild(makeCover(a.name, a.artist));
    t.appendChild(txt("div", "t1", a.name));
    t.appendChild(txt("div", "t2", showArtist ? a.artist : `${a.count} chanson${a.count > 1 ? "s" : ""}`));
    t.onclick = () => openAlbum(a);
    g.appendChild(t);
  }
  page.appendChild(g);
}

function renderAlbums(page) {
  page.appendChild(txt("h1", "big", "Albums"));
  const list = albums.slice().sort((x, y) => sortKey(x.name).localeCompare(sortKey(y.name), "fr"));
  albumGrid(page, list, true);
}

let songsByTitle = null;
function renderSongs(page) {
  page.appendChild(txt("h1", "big", "Chansons"));
  const btns = el("div", "btns");
  const pl = el("button", "pill", ICON.play + "Lecture"); pl.onclick = () => playGroup(0, songs.length, false);
  const sh = el("button", "pill", ICON.shuf + "Aléatoire"); sh.onclick = () => playGroup(0, songs.length, true);
  btns.append(pl, sh); page.appendChild(btns);

  lettered(page, songsByTitle, s => s.title, s => row({
    cover: makeCover(s.al.name, s.al.artist, "s"), t1: s.title, t2: s.al.artist, i: s.i,
    onClick: () => playSong(s.i) }));
}

function openArtist(a) {
  push(a.name, page => {
    const h = el("div", "head");
    h.appendChild(makeCover(a.name, "", "round"));
    h.appendChild(txt("div", "ttl", a.name));
    page.appendChild(h);
    const btns = el("div", "btns");
    const pl = el("button", "pill", ICON.play + "Lecture"); pl.onclick = () => playGroup(a.first, a.count, false);
    const sh = el("button", "pill", ICON.shuf + "Aléatoire"); sh.onclick = () => playGroup(a.first, a.count, true);
    btns.append(pl, sh); page.appendChild(btns);
    page.appendChild(txt("h2", "", "Albums"));
    albumGrid(page, a.albums, false);
    page.appendChild(txt("h2", "", "Chansons"));
    const ul = el("ul", "list");
    for (let i = a.first; i < a.first + a.count; i++) {
      const s = songs[i];
      ul.appendChild(row({ cover: makeCover(s.al.name, s.al.artist, "s"), t1: s.title, t2: s.al.name, dur: mss(s.secs), i,
        onClick: () => playSong(i, a.first, a.count) }));

  });
}

function openAlbum(a) {
  push(a.name, page => {
    const h = el("div", "head");
    h.appendChild(makeCover(a.name, a.artist));
    h.appendChild(txt("div", "ttl", a.name));
    const ar = txt("button", "art", a.artist);
    ar.onclick = () => openArtist(a.ar);
    h.appendChild(ar);
    page.appendChild(h);
    const btns = el("div", "btns");
    const pl = el("button", "pill", ICON.play + "Lecture"); pl.onclick = () => playGroup(a.first, a.count, false);
    const sh = el("button", "pill", ICON.shuf + "Aléatoire"); sh.onclick = () => playGroup(a.first, a.count, true);
    btns.append(pl, sh); page.appendChild(btns);
    const ul = el("ul", "list");
    for (let k = 0; k < a.count; k++) {
      const i = a.first + k, s = songs[i];
      ul.appendChild(row({ num: k + 1, t1: s.title, dur: mss(s.secs), i, onClick: () => playSong(i, a.first, a.count) }));
    }
    page.appendChild(ul);
    page.appendChild(txt("div", "foot", `${a.count} chanson${a.count > 1 ? "s" : ""}, ${Math.round(a.secs / 60)} minutes`));
  });
}

// A-Z index on the right edge
function buildAz(page) {
  const bar = $("azbar");
  bar.innerHTML = "";
  const letters = [...page.querySelectorAll(".letter")];
  if (!letters.length) return;
  const all = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#".split("");
  for (const L of all) bar.appendChild(txt("span", "", L));
  const go = y => {
    const r = bar.getBoundingClientRect();
    const L = all[Math.max(0, Math.min(all.length - 1, Math.floor((y - r.top) / r.height * all.length)))];
    let target = letters.find(h => h.dataset.l >= L && h.dataset.l !== "#") || (L === "#" ? letters.find(h => h.dataset.l === "#") : null) || letters[letters.length - 1];
    page.scrollTop = target.offsetTop - 4;
  };
  bar.ontouchstart = bar.ontouchmove = e => { e.preventDefault(); go(e.touches[0].clientY); };
  bar.onclick = e => go(e.clientY);
}

// ---------------- search ----------------
function renderSearch() {
  const page = $("pageSearch");
  page.innerHTML = "";
  page.appendChild(txt("h1", "big", "Recherche"));
  const box = el("div", "searchbox", '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>');
  const inp = document.createElement("input");
  inp.id = "q"; inp.type = "text"; inp.enterKeyHint = "search"; inp.placeholder = "Artistes, albums, chansons";
  inp.autocomplete = "off"; inp.autocorrect = "off"; inp.spellcheck = false;
  inp.value = load("lastSearch") || "";
  const clr = txt("button", "", "✕"); clr.onclick = () => { inp.value = ""; runSearch(); inp.focus(); };
  box.append(inp, clr);
  page.appendChild(box);
  const res = el("div"); res.id = "res"; page.appendChild(res);
  let t;
  inp.oninput = () => { clearTimeout(t); t = setTimeout(runSearch, 200); };
  inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); };
  runSearch();
}
function runSearch() {
  const q = fold($("q").value), res = $("res");
  store("lastSearch", $("q").value);
  res.innerHTML = "";
  if (!songs.length) { noCatalogBox(res); return; }
  if (!q) { res.appendChild(txt("div", "empty", "Tape un nom d'artiste, d'album ou de chanson. Les accents et les fautes de lettres doublées ne comptent pas.")); return; }
  const ar = artists.filter(a => a.key.includes(q)).slice(0, 8);
  const al = albums.filter(a => a.key.includes(q)).slice(0, 10);
  const so = songs.filter(s => s.key.includes(q));
  if (!ar.length && !al.length && !so.length) { res.appendChild(txt("div", "empty", "Aucun résultat.")); return; }
  if (ar.length) {
    res.appendChild(txt("h2", "", "Artistes"));
    const ul = el("ul", "list");
    for (const a of ar) ul.appendChild(row({ cover: makeCover(a.name, "", "s round"), t1: a.name, t2: `${a.count} chansons`, chev: true,
      onClick: () => { showTab("Library"); stack.length = 0; openArtist(a); } }));
    res.appendChild(ul);
  }
  if (al.length) {
    res.appendChild(txt("h2", "", "Albums"));
    const ul = el("ul", "list");
    for (const a of al) ul.appendChild(row({ cover: makeCover(a.name, a.artist, "s"), t1: a.name, t2: a.artist, chev: true,
      onClick: () => { showTab("Library"); stack.length = 0; openAlbum(a); } }));
    res.appendChild(ul);
  }
  if (so.length) {
    res.appendChild(txt("h2", "", `Chansons (${so.length})`));
    const ul = el("ul", "list");
    for (const s of so.slice(0, 300)) ul.appendChild(row({ cover: makeCover(s.al.name, s.al.artist, "s"), t1: s.title,
      t2: s.al.artist + " · " + s.al.name, i: s.i, onClick: () => playSong(s.i, s.al.first, s.al.count) }));
    res.appendChild(ul);
  }
}

// ---------------- speaker (settings) ----------------
let wantedSpeaker = "", seenSpeakers = new Map();
function addSpeaker(name, rssi) { seenSpeakers.set(name, rssi); renderSettings(); }

function renderSettings() {
  const page = $("pageSettings");
  if (tab !== "Settings" && page.childElementCount) return;
  page.innerHTML = "";
  page.appendChild(txt("h1", "big", "Enceinte"));
  const codes = { 1: ["ok", "Connectée"], 2: ["warn", "Connexion…"], 3: ["scan", "Recherche d'enceintes (30 s)…"], 0: ["bad", "Non connectée"] };
  const [cls, label] = connected ? (codes[status.speaker] || ["", "?"]) : ["", "Jukebox non connecté"];
  const g1 = el("div", "group");
  const r1 = row({ t1: wantedSpeaker || "Enceinte", t2: label });
  r1.prepend(el("span", "dot " + cls));
  g1.appendChild(r1);
  const rc = row({ t1: "Reconnecter maintenant", onClick: () => { send("reconnect"); toast("Essai avec l'enceinte…"); } });
  rc.querySelector(".t1").classList.add("act");
  g1.appendChild(rc);
  page.appendChild(g1);

  page.appendChild(txt("div", "ghead", "Changer d'enceinte"));
  const g2 = el("div", "group");
  const sc = row({ t1: "Chercher des enceintes", onClick: () => ask("Chercher des enceintes ?",
    "Mets l'enceinte en mode appairage. La musique s'arrête environ 40 secondes, puis reprend toute seule.",
    "Chercher", () => { seenSpeakers.clear(); send("scan"); toast("Recherche pendant 30 secondes…", 6000); }) });
  sc.querySelector(".t1").classList.add("act");
  g2.appendChild(sc);
  for (const [name, rssi] of seenSpeakers) {
    const r = row({ t1: name, t2: name === wantedSpeaker ? "Enceinte actuelle" : "Toucher pour l'utiliser",
      onClick: () => chooseSpeaker(name) });
    r.appendChild(txt("span", "bars", rssi > -60 ? "▂▄▆█" : rssi > -75 ? "▂▄▆" : "▂▄"));
    g2.appendChild(r);
  }
  const f = el("div", "field");
  const inp = document.createElement("input"); inp.placeholder = "Ou tape le nom de l'enceinte"; inp.id = "spkName";
  const ok = txt("button", "", "Utiliser"); ok.onclick = () => { const n = inp.value.trim(); if (n) chooseSpeaker(n); };
  f.append(inp, ok); g2.appendChild(f);
  page.appendChild(g2);
  page.appendChild(txt("div", "gfoot", "Changer d'enceinte efface tout ce que le jukebox sait de l'ancienne, puis il redémarre et se connecte à la nouvelle. La chanson reprend où elle était."));

  page.appendChild(txt("div", "ghead", "Bibliothèque"));
  const g3 = el("div", "group");
  g3.appendChild(row({ t1: songs.length ? `${songs.length} chansons sur le téléphone` : "Pas encore chargée",
    t2: cardInfo ? `Carte SD : ${cardInfo.songs} chansons` : "" }));
  const rl = row({ t1: "Recharger depuis la carte", onClick: () => {
    if (!connected || !cardInfo || cardInfo.id === "none") { toast("Connecte-toi au jukebox d'abord."); return; }
    showTab("Library"); stack.length = 0; startDownload(cardInfo.id, cardInfo.size); } });
  rl.querySelector(".t1").classList.add("act");
  g3.appendChild(rl);
  page.appendChild(g3);
  if (!connected) {
    const b = txt("button", "bigbtn", "Se connecter au jukebox");
    b.style.margin = "0 auto"; b.style.display = "block";
    b.onclick = () => $("connect").classList.remove("hidden");
    page.appendChild(b);
  }
}

function chooseSpeaker(name) {
  ask(`Utiliser « ${name} » ?`, "Le jukebox oublie l'ancienne enceinte, redémarre et se connecte à celle-ci (environ 15 secondes).",
    "Utiliser", () => { send("speaker:" + name); wantedSpeaker = name; toast("Changement d'enceinte…", 8000); });
}

function ask(title, text, yes, fn) {
  const c = $("sheetCard");
  c.innerHTML = "";
  const m = el("div", "msg"); m.appendChild(txt("b", "", title)); m.appendChild(document.createTextNode(text));
  const b = txt("button", "", yes);
  b.onclick = () => { $("sheet").classList.add("hidden"); fn(); };
  c.append(m, b);
  $("sheet").classList.remove("hidden");
}
$("sheetCancel").onclick = () => $("sheet").classList.add("hidden");
$("sheet").onclick = e => { if (e.target.id === "sheet") $("sheet").classList.add("hidden"); };

function renderAll() { songsByTitle = null; stack.length = 0; drawLibraryTop(); renderSearch(); renderSettings(); }

// start: use the song list kept on this phone (works even before connecting)
(function init() {
  const cached = load("catalog");
  if (cached) { try { parseCatalog(cached); } catch (e) { songs = []; } }
  renderAll();
  drawPlayer();
})();
</script>
